name: Build and Publish YouOke Plugin

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/local-bridge/**'
      - 'youoke-plugin/**'
      - '.github/workflows/build-plugin.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'youoke-plugin/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Lint Code (Syntax and Undefined Names)
        run: |
          pip install flake8
          flake8 --select=E9,F63,F7,F82 scripts/local-bridge/server.py

      - name: Install Python Dependencies & PyInstaller
        run: |
          pip install -r scripts/local-bridge/requirements.txt
          pip install pyinstaller

      - name: Build Python Backend (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos -o scripts/local-bridge/yt-dlp_macos
          chmod +x scripts/local-bridge/yt-dlp_macos
          pyinstaller --name youoke-server --onefile --add-data "scripts/local-bridge/yt-dlp_macos:." --collect-data demucs --collect-binaries imageio_ffmpeg --collect-all torchaudio --hidden-import soundfile --hidden-import websockets --hidden-import curl_cffi --collect-all nodejs_wheel --collect-all pytubefix --collect-all innertube --collect-all yt_dlp scripts/local-bridge/server.py
          mkdir -p youoke-plugin/bin
          cp dist/youoke-server youoke-plugin/bin/

      - name: Build Python Backend (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o scripts\local-bridge\yt-dlp.exe
          pyinstaller --name youoke-server --onefile --add-data "scripts\local-bridge\yt-dlp.exe;." --collect-data demucs --collect-binaries imageio_ffmpeg --collect-all torchaudio --hidden-import soundfile --hidden-import websockets --hidden-import curl_cffi --collect-all nodejs_wheel --collect-all pytubefix --collect-all innertube --collect-all yt_dlp scripts\local-bridge\server.py
          mkdir youoke-plugin\bin
          copy dist\youoke-server.exe youoke-plugin\bin\

      - name: Install Node Dependencies
        working-directory: youoke-plugin
        run: npm install

      - name: Build and Publish Electron App
        working-directory: youoke-plugin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            npm run dist:mac -- -p always
          else
            npm run dist:win -- -p always
          fi
        shell: bash
