name: Build and Publish YouOke Plugin

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'youoke-plugin/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          pip install -r scripts/local-bridge/requirements.txt
          pip install pyinstaller

      - name: Build Python Backend (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --name youoke-server --onefile --collect-data demucs --collect-binaries imageio_ffmpeg scripts/local-bridge/server.py
          mkdir -p youoke-plugin/bin
          cp dist/youoke-server youoke-plugin/bin/

      - name: Build Python Backend (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --name youoke-server --onefile --collect-data demucs --collect-binaries imageio_ffmpeg scripts\local-bridge\server.py
          mkdir youoke-plugin\bin
          copy dist\youoke-server.exe youoke-plugin\bin\

      - name: Install Node Dependencies
        working-directory: youoke-plugin
        run: npm install

      - name: Build and Publish Electron App
        working-directory: youoke-plugin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            npm run dist:mac -- -p always
          else
            npm run dist:win -- -p always
          fi
        shell: bash
