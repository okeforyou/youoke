<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouOke AI Dashboard</title>
    <!-- Import Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090b; /* zinc-950 */
            --panel-bg: #18181b; /* zinc-900 */
            --panel-hover-bg: #27272a;
            --primary: #ef4444; /* YouOke Red */
            --primary-hover: #dc2626;
            --text-color: #a1a1aa; /* zinc-400 */
            --text-white: #f4f4f5; /* zinc-100 */
            --text-muted: #71717a; /* zinc-500 */
            --border-color: #27272a; /* zinc-800 */
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981; /* emerald-500 */
            --font-family: 'IBM Plex Sans Thai', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f4f4f5; /* zinc-100 */
                --panel-bg: #ffffff;
                --panel-hover-bg: #fafafa;
                --primary: #ef4444;
                --primary-hover: #dc2626;
                --text-color: #52525b; /* zinc-600 */
                --text-white: #09090b; /* zinc-950 */
                --text-muted: #a1a1aa;
                --border-color: #e4e4e7; /* zinc-200 */
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 13px;
            letter-spacing: -0.01em;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 99px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Header styling */
        header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, rgba(239, 68, 68, 0.04) 0%, rgba(9, 9, 11, 0) 100%), var(--bg-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area h1 {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-white);
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .logo-area span {
            color: var(--primary);
            font-weight: 400;
            text-transform: none;
            margin-left: 2px;
            opacity: 0.95;
        }

        .status-badge {
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 9999px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(82, 82, 91, 0.1);
            color: #71717a;
            border: 1px solid rgba(82, 82, 91, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.05em;
        }

        .status-badge.online {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: currentColor;
            display: inline-block;
        }

        .status-badge.online .status-dot {
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Navigation Tabs */
        nav {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
            flex-shrink: 0;
            padding: 0 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 14px 10px;
            background: none;
            border: none;
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            font-size: 13px;
            position: relative;
            opacity: 0.7;
        }

        .tab-btn::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background-color: var(--primary);
            transition: width 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-white);
            opacity: 1;
        }

        .tab-btn.active {
            color: var(--text-white);
            opacity: 1;
        }

        .tab-btn.active::after {
            width: 40px;
        }

        /* Content containers */
        main {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .tab-content {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            flex-direction: column;
            padding: 16px;
            overflow-y: auto;
        }

        .tab-content.active {
            display: flex;
        }

        /* List elements */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .job-card, .cache-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .job-card:hover, .cache-card:hover {
            border-color: rgba(239, 68, 68, 0.25);
            background-color: var(--panel-hover-bg);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .card-title {
            font-weight: 600;
            color: var(--text-white);
            font-size: 13px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .card-subtitle {
            font-size: 11px;
            color: var(--text-color);
            opacity: 0.65;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Buttons and controls */
        .btn {
            background: none;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid transparent;
            font-family: var(--font-family);
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.15);
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: #ffffff;
            border-color: var(--danger);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        .btn-danger:active {
            transform: translateY(0);
        }

        /* Progress bar */
        .progress-bar-container {
            width: 100%;
            height: 4px;
            background-color: rgba(255,255,255,0.06);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, #f43f5e 100%);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 99px;
        }

        .job-status-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-color);
            opacity: 0.8;
            font-weight: 500;
        }

        /* Empty states */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex: 1;
            color: var(--text-muted);
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 36px;
            margin-bottom: 2px;
            opacity: 0.35;
            animation: float-icon 3s ease-in-out infinite;
        }

        @keyframes float-icon {
            0% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }

        /* Cache bottom actions */
        .footer-actions {
            margin-top: 15px;
            padding: 14px 4px 4px 4px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .cache-info {
            font-size: 11px;
            color: var(--text-color);
            opacity: 0.7;
            font-weight: 500;
        }

        .cache-info span {
            color: var(--text-white);
            font-weight: 700;
        }

        /* Badge mode styling */
        .badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
        }

        .badge-pro {
            background-color: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.15);
        }

        .badge-basic {
            background-color: rgba(113, 113, 122, 0.1);
            color: #a1a1aa;
            border: 1px solid rgba(113, 113, 122, 0.15);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <h1>YouOke AI <span>Dashboard</span></h1>
        </div>
        <div id="connection-status" class="status-badge">
            <span class="status-dot"></span>
            <span id="status-text">OFFLINE</span>
        </div>
    </header>

    <nav>
        <button id="tab-jobs" class="tab-btn active">กำลังแยกเสียง (<span id="jobs-count">0</span>)</button>
        <button id="tab-cache" class="tab-btn">แคชข้อมูล (<span id="cache-count">0</span>)</button>
    </nav>

    <main>
        <!-- ACTIVE JOBS TAB -->
        <div id="content-jobs" class="tab-content active">
            <div id="jobs-list" class="list-container">
                <!-- Dynamic Content -->
            </div>
            <div id="jobs-empty" class="empty-state">
                <div class="empty-icon">⏳</div>
                <p>ไม่มีเพลงที่กำลังแยกเสียงในขณะนี้</p>
            </div>
        </div>

        <!-- CACHE MANAGER TAB -->
        <div id="content-cache" class="tab-content">
            <div id="cache-list" class="list-container">
                <!-- Dynamic Content -->
            </div>
            <div id="cache-empty" class="empty-state" style="display: none;">
                <div class="empty-icon">📁</div>
                <p>ไม่มีไฟล์แคชเพลงในเครื่องของคุณ</p>
            </div>
            <div id="cache-footer" class="footer-actions">
                <div class="cache-info">ขนาดแคชทั้งหมด: <span id="total-cache-size">0.00</span> MB</div>
                <button id="clear-all-cache-btn" class="btn btn-danger">ล้างแคชทั้งหมด</button>
            </div>
        </div>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
