<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouOke AI Dashboard - Offline</title>
    <style>
        body {
            background-color: #09090b;
            color: #a1a1aa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            text-align: center;
        }
        h1 {
            color: #f4f4f5;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        button {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>
    <h1>ออฟไลน์ (Offline)</h1>
    <p>ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้ โปรดตรวจสอบการเชื่อมต่อของคุณและลองใหม่อีกครั้ง</p>
    <button onclick="window.location.reload()">โหลดใหม่</button>
</body>
</html>
