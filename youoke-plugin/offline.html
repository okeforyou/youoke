<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouOke AI Dashboard - Offline Mode</title>
    <!-- Import Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090b; /* zinc-950 */
            --panel-bg: #18181b; /* zinc-900 */
            --panel-hover-bg: #27272a;
            --primary: #ef4444; /* YouOke Red */
            --primary-hover: #dc2626;
            --text-color: #a1a1aa; /* zinc-400 */
            --text-white: #f4f4f5; /* zinc-100 */
            --text-muted: #71717a; /* zinc-500 */
            --border-color: #27272a; /* zinc-800 */
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981; /* emerald-500 */
            --font-family: 'IBM Plex Sans Thai', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f4f4f5; /* zinc-100 */
                --panel-bg: #ffffff;
                --panel-hover-bg: #fafafa;
                --primary: #ef4444;
                --primary-hover: #dc2626;
                --text-color: #52525b; /* zinc-600 */
                --text-white: #09090b; /* zinc-950 */
                --text-muted: #a1a1aa;
                --border-color: #e4e4e7; /* zinc-200 */
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, button, input, select, textarea, span, div, h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-family);
        }

        .card-header .btn {
            min-width: 68px;
            justify-content: center;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 13px;
            letter-spacing: -0.01em;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 99px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Header styling */
        header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, rgba(239, 68, 68, 0.04) 0%, rgba(9, 9, 11, 0) 100%), var(--bg-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area h1 {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-white);
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .logo-area span {
            color: var(--primary);
            font-weight: 400;
            text-transform: none;
            margin-left: 2px;
            opacity: 0.95;
        }

        .status-badge {
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 9999px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(82, 82, 91, 0.1);
            color: #71717a;
            border: 1px solid rgba(82, 82, 91, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.05em;
        }

        .status-badge.online {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: currentColor;
            display: inline-block;
        }

        .status-badge.online .status-dot {
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Navigation Tabs */
        nav {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
            flex-shrink: 0;
            padding: 0 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 14px 10px;
            background: none;
            border: none;
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            font-size: 13px;
            position: relative;
            opacity: 0.7;
        }

        .tab-btn::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background-color: var(--primary);
            transition: width 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-white);
            opacity: 1;
        }

        .tab-btn.active {
            color: var(--text-white);
            opacity: 1;
        }

        .tab-btn.active::after {
            width: 40px;
        }

        /* Content containers */
        main {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .tab-content {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            flex-direction: column;
            padding: 16px;
            overflow-y: auto;
        }

        .tab-content.active {
            display: flex;
        }

        /* List elements */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .job-card, .cache-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .job-card:hover, .cache-card:hover {
            border-color: rgba(239, 68, 68, 0.25);
            background-color: var(--panel-hover-bg);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .card-title {
            font-weight: 600;
            color: var(--text-white);
            font-size: 13px;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-subtitle {
            font-size: 11px;
            color: var(--text-color);
            opacity: 0.65;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Buttons and controls */
        .btn {
            background: none;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid transparent;
            font-family: var(--font-family);
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.15);
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: #ffffff;
            border-color: var(--danger);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        .btn-danger:active {
            transform: translateY(0);
        }

        .btn-secondary {
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }
        .btn-secondary:hover {
            background-color: var(--panel-hover-bg);
            color: var(--text-white);
        }

        /* Progress bar */
        .progress-bar-container {
            width: 100%;
            height: 4px;
            background-color: rgba(255,255,255,0.06);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, #f43f5e 100%);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 99px;
        }

        .job-status-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-color);
            opacity: 0.8;
            font-weight: 500;
        }

        /* Empty states */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex: 1;
            color: var(--text-muted);
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 36px;
            margin-bottom: 2px;
            opacity: 0.35;
            animation: float-icon 3s ease-in-out infinite;
        }

        @keyframes float-icon {
            0% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }

        /* Cache bottom actions */
        .footer-actions {
            margin-top: 15px;
            padding: 14px 4px 4px 4px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .cache-info {
            font-size: 11px;
            color: var(--text-color);
            opacity: 0.7;
            font-weight: 500;
        }

        .cache-info span {
            color: var(--text-white);
            font-weight: 700;
        }

        /* Badge mode styling */
        .badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
        }

        .badge-pro {
            background-color: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.15);
        }

        .badge-basic {
            background-color: rgba(113, 113, 122, 0.1);
            color: #a1a1aa;
            border: 1px solid rgba(113, 113, 122, 0.15);
        }

        /* Offline Banner */
        .offline-banner {
            background-color: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border-bottom: 1px solid rgba(245, 158, 11, 0.25);
            padding: 6px 16px;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        
        .offline-banner button {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
        }
        .offline-banner button:hover {
            background: #f59e0b;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="offline-banner">
        <span>⚠️ โหมดออฟไลน์: กำลังดึงข้อมูลจากตัวเครื่องของคุณโดยตรง</span>
        <button onclick="window.location.reload()">เชื่อมต่อใหม่</button>
    </div>

    <header>
        <div class="logo-area">
            <h1>YouOke AI <span>Dashboard</span></h1>
        </div>
        <div id="connection-status" class="status-badge">
            <span class="status-dot"></span>
            <span id="status-text">OFFLINE</span>
        </div>
    </header>

    <nav>
        <button id="tab-jobs" class="tab-btn active">กำลังแยกเสียง (<span id="jobs-count">0</span>)</button>
        <button id="tab-cache" class="tab-btn">แคชข้อมูล (<span id="cache-count">0</span>)</button>
    </nav>

    <main>
        <!-- ACTIVE JOBS TAB -->
        <div id="content-jobs" class="tab-content active">
            <div id="jobs-list" class="list-container">
                <!-- Dynamic Content -->
            </div>
            <div id="jobs-empty" class="empty-state">
                <div class="empty-icon">⏳</div>
                <p>ไม่มีเพลงที่กำลังแยกเสียงในขณะนี้</p>
            </div>
        </div>

        <!-- CACHE MANAGER TAB -->
        <div id="content-cache" class="tab-content">
            <div id="cache-list" class="list-container">
                <!-- Dynamic Content -->
            </div>
            <div id="cache-empty" class="empty-state" style="display: none;">
                <div class="empty-icon">📁</div>
                <p>ไม่มีไฟล์แคชเพลงในเครื่องของคุณ</p>
            </div>
            <div id="cache-footer" class="footer-actions">
                <div class="cache-info">ขนาดแคชทั้งหมด: <span id="total-cache-size">0.00</span> MB</div>
                <button id="clear-all-cache-btn" class="btn btn-danger">ล้างแคชทั้งหมด</button>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = "http://127.0.0.1:5050";
        let activeTab = "jobs"; // "jobs" or "cache"
        let serverOnline = false;
        let updateInterval = null;

        // DOM Elements
        const connectionStatus = document.getElementById("connection-status");
        const statusText = document.getElementById("status-text");
        const tabJobs = document.getElementById("tab-jobs");
        const tabCache = document.getElementById("tab-cache");
        const contentJobs = document.getElementById("content-jobs");
        const contentCache = document.getElementById("content-cache");
        const jobsList = document.getElementById("jobs-list");
        const jobsEmpty = document.getElementById("jobs-empty");
        const cacheList = document.getElementById("cache-list");
        const cacheEmpty = document.getElementById("cache-empty");
        const jobsCount = document.getElementById("jobs-count");
        const cacheCount = document.getElementById("cache-count");
        const totalCacheSize = document.getElementById("total-cache-size");
        const clearAllCacheBtn = document.getElementById("clear-all-cache-btn");

        // Init listeners
        tabJobs.addEventListener("click", () => switchTab("jobs"));
        tabCache.addEventListener("click", () => switchTab("cache"));
        clearAllCacheBtn.addEventListener("click", clearAllCache);

        function switchTab(tab) {
            activeTab = tab;
            if (tab === "jobs") {
                tabJobs.classList.add("active");
                tabCache.classList.remove("active");
                contentJobs.classList.add("active");
                contentCache.classList.remove("active");
                fetchJobs();
            } else {
                tabCache.classList.add("active");
                tabJobs.classList.remove("active");
                contentCache.classList.add("active");
                contentJobs.classList.remove("active");
                fetchCache();
            }
        }

        // Check if Python Server is alive
        async function checkServerStatus() {
            try {
                const res = await fetch(`${API_BASE}/`);
                if (res.ok || res.status === 404) {
                    setServerOnline(true);
                    return true;
                }
            } catch (e) {
                setServerOnline(false);
            }
            return false;
        }

        function setServerOnline(online) {
            serverOnline = online;
            if (online) {
                connectionStatus.className = "status-badge online";
                statusText.innerText = "ONLINE";
            } else {
                connectionStatus.className = "status-badge";
                statusText.innerText = "OFFLINE";
            }
        }

        // Fetch active jobs from Server
        async function fetchJobs() {
            if (!serverOnline && !(await checkServerStatus())) return;

            try {
                const res = await fetch(`${API_BASE}/jobs`);
                if (!res.ok) throw new Error("Failed to load jobs");
                const jobs = await res.json();
                
                const activeJobs = jobs.filter(j => ['queued', 'starting', 'downloading', 'converting', 'separating', 'compressing', 'paused', 'error'].includes(j.status));
                jobsCount.innerText = activeJobs.length;
                
                renderJobs(activeJobs);
            } catch (e) {
                console.error(e);
            }
        }

        // Render active jobs list
        function renderJobs(jobs) {
            if (jobs.length === 0) {
                jobsList.style.display = "none";
                jobsEmpty.style.display = "flex";
                return;
            }

            jobsList.style.display = "flex";
            jobsEmpty.style.display = "none";

            jobsList.innerHTML = jobs.map(job => {
                const percent = job.percent || 0;
                const isPaused = job.status === 'paused';
                const isQueued = job.status === 'queued';
                const isError = job.status === 'error';
                
                return `
                    <div class="job-card" data-id="${job.video_id}" style="${isError ? 'border-color: rgba(239, 68, 68, 0.4); background-color: rgba(239, 68, 68, 0.03);' : ''}">
                        <div class="card-header">
                            <div style="flex: 1; min-width: 0;">
                                <div class="card-title" title="${job.title || job.video_id}">${job.title || job.video_id}</div>
                                <div class="card-subtitle">
                                    <span class="badge ${job.mode === 'pro' ? 'badge-pro' : 'badge-basic'}">${job.mode === 'pro' ? '4CH' : '2CH'}</span>
                                    | ID: ${job.video_id}
                                </div>
                            </div>
                            <div style="display: flex; gap: 6px; align-items: center;">
                                ${isError 
                                    ? `<button class="btn btn-secondary" style="background-color: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3);" onclick="resumeJob('${job.video_id}')">ลองใหม่</button>`
                                    : (isPaused 
                                        ? `<button class="btn btn-secondary" style="background-color: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3);" onclick="resumeJob('${job.video_id}')">ทํางานต่อ</button>`
                                        : `<button class="btn btn-secondary" style="background-color: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3);" onclick="pauseJob('${job.video_id}')">หยุดพัก</button>`)
                                }
                                <button class="btn btn-danger" onclick="cancelJob('${job.video_id}', ${isError})">${isError ? 'ลบออก' : 'ยกเลิก'}</button>
                            </div>
                        </div>
                        ${isError 
                            ? `
                                <div style="font-size: 11px; color: #ef4444; font-weight: 600; margin-top: 4px; display: flex; align-items: center; gap: 4px;">
                                    <span>⚠️ ${job.message || 'ดาวน์โหลดล้มเหลว'}</span>
                                </div>
                              `
                            : `
                                <div class="progress-bar-container">
                                    <div class="progress-bar" style="width: ${isQueued ? 5 : percent}%"></div>
                                </div>
                                <div class="job-status-row">
                                    <span>สถานะ: ${getStatusText(job.status)}</span>
                                    <span>${isQueued ? 'ต่อคิว' : percent + '%'}</span>
                                </div>
                                <div style="font-size: 11px; color: #a5a6a7; margin-top: -2px;">
                                    ${job.message || ''}
                                </div>
                              `
                        }
                    </div>
                `;
            }).join("");
        }

        function getStatusText(status) {
            switch (status) {
                case "queued": return "รอคิวประมวลผล...";
                case "starting": return "กำลังเตรียมการ...";
                case "downloading": return "กำลังดาวน์โหลด...";
                case "converting": return "กำลังแปลงไฟล์...";
                case "separating": return "กำลังแยกเสียงร้อง/ดนตรี...";
                case "compressing": return "กำลังบีบอัดไฟล์...";
                case "paused": return "หยุดชั่วคราว";
                case "error": return "ล้มเหลว";
                default: return status;
            }
        }

        // Pause job
        async function pauseJob(videoId) {
            try {
                const res = await fetch(`${API_BASE}/pause/${videoId}`, { method: "POST" });
                const data = await res.json();
                if (data.status === "success") fetchJobs();
            } catch (e) {
                console.error(e);
            }
        }

        // Resume job
        async function resumeJob(videoId) {
            try {
                const res = await fetch(`${API_BASE}/resume/${videoId}`, { method: "POST" });
                const data = await res.json();
                if (data.status === "success") fetchJobs();
            } catch (e) {
                console.error(e);
            }
        }

        // Cancel job
        async function cancelJob(videoId, isError = false) {
            const confirmMsg = isError 
                ? "คุณต้องการลบรายการข้อผิดพลาดนี้ใช่หรือไม่?"
                : "คุณต้องการยกเลิกการแยกเสียงเพลงนี้ใช่หรือไม่?";
            if (!confirm(confirmMsg)) return;
            
            try {
                const res = await fetch(`${API_BASE}/cancel/${videoId}`, { method: "POST" });
                const data = await res.json();
                if (data.status === "success") {
                    fetchJobs();
                } else {
                    alert("ยกเลิกงานไม่สำเร็จ: " + data.message);
                }
            } catch (e) {
                alert("ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์เพื่อยกเลิกได้");
            }
        }

        // Fetch cache library list
        async function fetchCache() {
            if (!serverOnline && !(await checkServerStatus())) return;

            try {
                const res = await fetch(`${API_BASE}/cache/list`);
                if (!res.ok) throw new Error("Failed to load cache");
                const data = await res.json();
                if (data.status === "success") {
                    const results = data.results || [];
                    cacheCount.innerText = results.length;
                    
                    let totalSize = 0;
                    results.forEach(item => totalSize += item.size_mb || 0);
                    totalCacheSize.innerText = totalSize.toFixed(2);
                    
                    renderCache(results);
                }
            } catch (e) {
                console.error(e);
            }
        }

        // Render cache list
        function renderCache(items) {
            if (items.length === 0) {
                cacheList.style.display = "none";
                cacheEmpty.style.display = "flex";
                return;
            }

            cacheList.style.display = "flex";
            cacheEmpty.style.display = "none";

            cacheList.innerHTML = items.map(item => {
                const formattedDate = new Date(item.created_at * 1000).toLocaleDateString("th-TH", {
                    year: "numeric",
                    month: "short",
                    day: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                });
                
                return `
                    <div class="cache-card">
                        <div class="card-header">
                            <div style="flex: 1; min-width: 0;">
                                <div class="card-title" title="${item.title}">${item.title}</div>
                                <div class="card-subtitle">
                                    <span class="badge ${item.mode === 'pro' ? 'badge-pro' : 'badge-basic'}">${item.mode === 'pro' ? '4CH' : '2CH'}</span>
                                    | ID: ${item.video_id} | ${formattedDate}
                                </div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
                                <span style="font-size: 12px; font-weight: bold; color: var(--text-white);">${item.size_mb} MB</span>
                                <button class="btn btn-danger" onclick="deleteCache('${item.video_id}')">ลบ</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join("");
        }

        // Delete cache entry
        async function deleteCache(videoId) {
            if (!confirm("คุณแน่ใจหรือไม่ว่าต้องการลบแคชของเพลงนี้?")) return;

            try {
                const res = await fetch(`${API_BASE}/cache/${videoId}`, { method: "DELETE" });
                const data = await res.json();
                if (data.status === "success") {
                    fetchCache();
                } else {
                    alert("ลบไฟล์ไม่สำเร็จ: " + data.message);
                }
            } catch (e) {
                alert("ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์เพื่อลบได้");
            }
        }

        // Clear all cache
        async function clearAllCache() {
            if (!confirm("🚨 คำเตือน! คุณต้องการลบแคชเพลงที่แยกเสร็จแล้วทั้งหมดใช่หรือไม่? (เพลงจะหายไปจากเครื่อง ต้องกดแยกเสียงใหม่ในการเล่นครั้งถัดไป)")) return;

            try {
                const res = await fetch(`${API_BASE}/cache/list`);
                const data = await res.json();
                if (data.status === "success") {
                    const results = data.results || [];
                    let successCount = 0;
                    
                    for (const item of results) {
                        const delRes = await fetch(`${API_BASE}/cache/${item.video_id}`, { method: "DELETE" });
                        const delData = await delRes.json();
                        if (delData.status === "success") {
                            successCount++;
                        }
                    }
                    
                    alert(`ล้างแคชเรียบร้อยแล้ว ลบสำเร็จทั้งหมด ${successCount} เพลง`);
                    fetchCache();
                }
            } catch (e) {
                alert("เกิดข้อผิดพลาดในการล้างแคชทั้งหมด");
            }
        }

        // Start polling
        function startPolling() {
            checkServerStatus().then(() => {
                fetchJobs();
                if (activeTab === "cache") {
                    fetchCache();
                }
            });

            updateInterval = setInterval(() => {
                if (activeTab === "jobs") {
                    fetchJobs();
                } else {
                    fetchCache();
                }
            }, 2000);
        }

        // Global functions for onclick attributes
        window.cancelJob = cancelJob;
        window.pauseJob = pauseJob;
        window.resumeJob = resumeJob;
        window.deleteCache = deleteCache;

        // Start app
        startPolling();
    </script>
</body>
</html>
